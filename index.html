<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADD TO CART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="nav.css">

    <style>

    </style>
</head>

<body>

    <h1 class="heading">FLIPKART</h1>
    <div class="row" id="box">
        <div class="login">
            <h2>Login</h2>
            <input type="text" id="user" placeholder="Enter your username"><br>
            <input type="password" id="pass" placeholder="Enter your password"><br>
            <p id="err"></p>
            <button onclick="login()">Submit</button>
        </div>
    </div>


    <div class="dashbord" id="a" style="display: none; ">

        <nav class="navbar navbar-expand-lg bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">product</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="cart.html">cart</a>
                        </li>


                    </ul>
                </div>
            </div>
        </nav>
    </div>
    <div id="out"></div>

    <!-- <button onclick="get()"></button> -->




</body>
<script>
    let allProduct = []
    function login() {
        let username = document.getElementById("user").value.trim()
        let password = document.getElementById("pass").value.trim()
        let error = document.getElementById("err")

        fetch('https://fakestoreapi.com/users')
            .then(res => res.json())
            .then(data => {
                let userfound = data.find(u => u.username === username
                    && u.password === password)

                if (userfound) {
                    document.getElementById("a").style.display = "block"
                    document.getElementById("box").style.display = "none"
                    product()

                }
                else {
                    alert("user is not found")
                }
            })
    }



    function product() {
        fetch('https://fakestoreapi.com/products')
            .then(response => response.json())
            .then(data => {
                // console.log(data)
                allProduct = data
                let proDiv = document.getElementById("out");
                proDiv.innerHTML = "";

                data.forEach(p => {
                    proDiv.innerHTML += `
                        <div class="a">
                            <img src="${p.image}">
                            <h4 class="title">${p.title.slice(0, 25)}...</h4>
                            <p class="price"><b>$ ${p.price}</b></p>
                            <button onclick="addToCart(${p.id})">Add to Cart</button>
                        </div>
                    `;
                });

            });
    }


    
    // get old cart

    function addToCart(id) {
        let product = allProduct.find(p => p.id === id)

        let cart = JSON.parse(localStorage.getItem("cart")) || []

        let exist = cart.find(item => item.id === product.id)


        if (exist) {
            exist.quantity += 1
        }
        else {
            cart.push({
                id: product.id,
                title: product.title,
                price: product.price,
                image: product.image,
                quantity: 1
            });
        }

        localStorage.setItem("cart", JSON.stringify(cart))

        alert("Added to Cart")


    }











</script>

</html>
